<!DOCTYPE html>
<html lang="uk" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>StateSync</title>

    <style>
:root {
  --bg: #f4f4f2;
  --bg2: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --line: #e4e4e1;
  --accent: #111111;
  --accent-ink: #ffffff;
  --ok: #1a7f4b;
  --warn: #b45309;
  --bad: #b42318;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
  --radius: 18px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg2: #161616;
  --ink: #f5f5f5;
  --muted: #9a9a9a;
  --line: #2a2a2a;
  --accent: #f5f5f5;
  --accent-ink: #111111;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
}

#app { height: 100%; display: flex; flex-direction: column; }

.screen {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  animation: fadeUp 0.35s ease;
}
.screen.active { display: flex; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashIn {
  from { opacity: 0; letter-spacing: 0.4em; }
  to { opacity: 1; letter-spacing: 0.18em; }
}
@keyframes pulseLine {
  0%, 100% { transform: scaleX(0.4); opacity: 0.4; }
  50% { transform: scaleX(1); opacity: 1; }
}

/* SPLASH */
#screen-splash {
  background: #000;
  color: #fff;
  align-items: center;
  justify-content: center;
  text-align: center;
}
#screen-splash h1 {
  font-weight: 600;
  letter-spacing: 0.18em;
  font-size: 28px;
  animation: splashIn 0.8s ease;
}
#screen-splash p {
  margin-top: 10px;
  color: #9a9a9a;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.splash-line {
  width: 84px;
  height: 1px;
  background: #fff;
  margin: 18px auto 0;
  animation: pulseLine 1.2s ease infinite;
}

/* GATES */
.gate {
  padding: 28px 22px calc(24px + var(--safe-b));
  overflow: auto;
}
.brand-mark {
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 22px;
}
.gate h2 { font-size: 26px; font-weight: 650; margin-bottom: 14px; }
.gate p, .card p { color: var(--muted); line-height: 1.55; font-size: 14px; }

.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 18px 0;
  font-size: 14px;
}
.check input { margin-top: 3px; accent-color: var(--ink); }

.btn {
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  margin-top: 10px;
}
.btn-danger { background: var(--bad); color: #fff; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* APP SHELL */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px 8px;
  gap: 10px;
}
.code-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px 6px 12px;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.04em;
}
.code-chip button {
  border: 0;
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
}
.avatar-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  overflow: hidden;
  background: var(--bg2);
  cursor: pointer;
  padding: 0;
}
.avatar-btn img, .avatar-fallback {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.content {
  flex: 1;
  overflow: auto;
  padding: 8px 16px calc(18px + var(--nav-h) + var(--safe-b));
}

.hero {
  padding: 8px 2px 18px;
}
.hero h2 { font-size: 24px; line-height: 1.2; margin-bottom: 8px; }
.meta { font-size: 13px; color: var(--muted); margin: 10px 0; }
.meta b { color: var(--ink); }

.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
}
.item h3 { font-size: 15px; margin-bottom: 4px; }
.item small, .tag { color: var(--muted); font-size: 12px; }
.tag {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  margin: 4px 4px 0 0;
}
.tag.on { border-color: var(--ok); color: var(--ok); }

.search {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  margin-bottom: 12px;
}

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--bg2);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  z-index: 20;
}
.nav button {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
}
.nav button.active { color: var(--ink); font-weight: 700; }
.nav svg { width: 20px; height: 20px; }

.section-title { font-size: 20px; margin: 6px 0 12px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

.kv { font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
.kv span { color: var(--muted); }
.kv b { text-align: right; font-weight: 600; }

.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.switch-row:last-child { border-bottom: 0; }

.toggle {
  width: 44px;
  height: 26px;
  border-radius: 999px;
  border: 0;
  background: #cfcfcf;
  position: relative;
  cursor: pointer;
}
.toggle.on { background: var(--ink); }
.toggle i {
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.18s ease;
}
.toggle.on i { left: 21px; }

/* SIGNATURE */
.sign-box {
  border: 1px dashed var(--line);
  border-radius: 14px;
  background: var(--bg2);
  overflow: hidden;
}
#sign-canvas { width: 100%; height: 140px; display: block; touch-action: none; }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: flex-end;
  z-index: 40;
}
.modal.open { display: flex; animation: fadeUp 0.2s ease; }
.sheet {
  background: var(--bg);
  width: 100%;
  border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + var(--safe-b));
  max-height: 88%;
  overflow: auto;
}
.sheet h3 { margin-bottom: 10px; }
.field {
  width: 100%;
  margin: 8px 0;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
}
textarea.field { min-height: 88px; resize: vertical; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(80px + var(--safe-b));
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
  z-index: 50;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.status-pills { display: flex; gap: 8px; margin: 10px 0 14px; }
.status-pills button {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 999px;
  padding: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}
.status-pills button.on { background: var(--ink); color: var(--bg); }

.hidden { display: none !important; }
.mt { margin-top: 10px; }
.mb { margin-bottom: 10px; }

.role-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.role-chip {
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 12px 12px 14px;
  text-align: left;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.role-chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
.role-chip.sel { box-shadow: inset 0 0 0 2px var(--ink); }

.plus-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: var(--ink); color: var(--bg);
  font-size: 22px; line-height: 1; cursor: pointer;
}
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 6px; overflow: auto; margin-bottom: 12px; }
.tabs button {
  border: 1px solid var(--line); background: var(--bg2); color: var(--ink);
  border-radius: 999px; padding: 7px 11px; white-space: nowrap; cursor: pointer; font-size: 12px;
}
.tabs button.on { background: var(--ink); color: var(--bg); }
.ok-msg { color: #16a34a; font-weight: 700; margin: 8px 0 12px; }
.radio { display: flex; gap: 14px; margin: 8px 0; font-size: 14px; align-items: center; }
.field-label { font-size: 12px; color: var(--muted); margin-top: 8px; display: block; }

    </style>

      { users: {}, documents: [], applications: [], licensesApps: [] },
      JSON.parse(localStorage.getItem(STORE_KEY) || "{}")

  } catch {
    return { users: {}, documents: [], applications: [], licensesApps: [] };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const base = defaultUser();
    if (!raw) return base;
    const parsed = JSON.parse(raw);
    parsed.telegram = Object.assign(base.telegram, parsed.telegram || {});
    const live = tgUser();
    if (live.id) {
      parsed.telegram.id = live.id;
      parsed.telegram.username = live.username || parsed.telegram.username;
      parsed.telegram.firstName = live.first_name || parsed.telegram.firstName;
      parsed.telegram.photo = live.photo_url || parsed.telegram.photo;
    }
    return Object.assign(base, parsed);
  } catch {
    return defaultUser();
  }
}

function uid() {
  return String(state.telegram.id);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  store = loadStore();
  store.users[uid()] = {
    telegram: state.telegram,
    roblox: state.roblox,
    status: state.status,
    roles: state.roles,
    licenses: state.licenses,
    linked: state.linked,
    signature: state.signature ? true : false,
  };
  saveStore(store);
}

function haptic(type) {
  if (!state.settings.haptic) return;
  try {
    if (tg && tg.HapticFeedback) {
      if (type === "ok") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    }
  } catch {}
}
function beep() {
  if (!state.settings.sounds) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = 660;
    g.gain.value = 0.03;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.07);
  } catch {}
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  if (tg) {
    try {
      tg.setHeaderColor(state.settings.theme === "dark" ? "#0a0a0a" : "#f4f4f2");
      tg.setBackgroundColor(state.settings.theme === "dark" ? "#0a0a0a" : "#f4f4f2");
    } catch {}
  }
}

  if (state.linked && (state.roblox.nickname || state.roblox.username))
    return state.roblox.nickname || state.roblox.username;
  return state.telegram.firstName || state.telegram.username || t("guest");
}
function avatarHtml() {
  if (state.linked && state.roblox.avatar) return `<img alt="" src="${state.roblox.avatar}">`;

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

}

function setupSignature() {
  const canvas = $("#sign-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = state.settings.theme === "dark" ? "#f5f5f5" : "#111";
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  if (state.signature) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = state.signature;
  }
  let draw = false;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: ((src.clientX - r.left) / r.width) * canvas.width, y: ((src.clientY - r.top) / r.height) * canvas.height };
  };
  canvas.onpointerdown = (e) => {
    draw = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  };
  canvas.onpointermove = (e) => {
    if (!draw) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  };
  canvas.onpointerup = () => {
    draw = false;
  };
  if ($("#sign-clear"))
    $("#sign-clear").onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      state.signature = "";
      saveState();
    };
  if ($("#sign-save"))
    $("#sign-save").onclick = () => {
      state.signature = canvas.toDataURL("image/png");
      saveState();
      haptic("ok");
      toast(t("saved"));
    };
}

function fieldHtml(f) {
  const lab = `<label class="field-label">${escapeHtml(f.label)}${f.req ? " *" : ""}</label>`;
  if (f.type === "textarea") return lab + `<textarea class="field" data-fid="${f.id}"></textarea>`;
  if (f.type === "yesno")
    return lab + `<div class="radio"><label><input type="radio" name="${f.id}" value="Так"> ${t("yes")}</label><label><input type="radio" name="${f.id}" value="Ні"> ${t("no")}</label></div>`;
  if (f.type === "select")
    return (
      lab +
      `<select class="field" data-fid="${f.id}">${f.options.map((o) => `<option>${escapeHtml(o)}</option>`).join("")}</select>`
    );
  return lab + `<input class="field" data-fid="${f.id}" />`;
}

function readFields(fields) {
  const data = {};
  for (const f of fields) {
    if (f.type === "yesno") {
      const el = document.querySelector(`input[name="${f.id}"]:checked`);
      data[f.id] = el ? el.value : "";
    } else {
      const el = document.querySelector(`[data-fid="${f.id}"]`);
      data[f.id] = el ? el.value.trim() : "";
    }
    if (f.req && !data[f.id]) return null;
  }
  return data;
}

  return `
    <input class="field" id="adm-docq" placeholder="${t("docsSearch")}">
    <div id="adm-doclist" class="list mt">${docsList(docs)}</div>`;
}
function docsList(docs) {
  if (!docs.length) return `<small>${t("docsEmpty")}</small>`;
  return docs
    .map(
      (d) =>
        `<div class="item"><h3>${escapeHtml(d.title)} · №${escapeHtml(d.number)}</h3>
        <small>${escapeHtml(d.fromName)} → ${escapeHtml(d.toName)} · ${escapeHtml(d.term)} ${d.sum ? "· " + escapeHtml(d.sum) : ""}</small>
        <p class="sub">${escapeHtml(d.terms)}</p></div>`
    )
    .join("");
}

function adminAppsHtml(kind) {
  const list = kind === "license" ? store.licensesApps || [] : store.applications || [];
  if (!list.length) return `<small>${t("noApps")}</small>`;
  return list
    .map((a) => {
      const allow = canReview(a.review);
      return `<div class="item">
        <h3>${escapeHtml(a.title)}</h3>
        <small>${escapeHtml(a.ownerName)} · ${t(a.status)}</small>
        ${allow ? `<button class="btn btn-ghost mt" data-app="${a.id}" data-kind="${kind}">${t("viewProfile")}</button>` : `<p class="sub">${t("noAccess")}</p>`}
      </div>`;
    })
    .join("");
}

function bindAdminBody() {
  $$("[data-role]").forEach((b) => {
    b.onclick = () => {
      selectedRole = b.dataset.role;
      renderAdmin("roles");
    };
  });
  if ($("#adm-find")) $("#adm-find").onclick = findPlayer;
  if ($("#adm-grant")) $("#adm-grant").onclick = () => mutateRole(true);
  if ($("#adm-revoke")) $("#adm-revoke").onclick = () => mutateRole(false);
  if ($("#adm-docq"))
    $("#adm-docq").oninput = () => {
      const q = $("#adm-docq").value.trim();
      const docs = (store.documents || []).filter((d) => String(d.number).includes(q) || (d.title || "").toLowerCase().includes(q.toLowerCase()));
      $("#adm-doclist").innerHTML = docsList(docs);
    };
  $$("[data-app]").forEach((b) => (b.onclick = () => openAppReview(b.dataset.kind, b.dataset.app)));
}

let adminFocusUser = null;

function findPlayer() {
  const q = ($("#adm-q").value || "").trim().replace(/^@/, "").toLowerCase();
  store = loadStore();
  let hit = null;
  Object.values(store.users || {}).forEach((u) => {
    const bag = [u.telegram && u.telegram.username, u.telegram && String(u.telegram.id), u.roblox && u.roblox.username, u.roblox && u.roblox.id]
      .filter(Boolean)
      .map((x) => String(x).toLowerCase());
    if (bag.includes(q)) hit = u;
  });
  if (!hit) {
    const bag = [state.telegram.username, String(state.telegram.id), state.roblox.username, state.roblox.id]
      .filter(Boolean)
      .map((x) => String(x).toLowerCase());
    if (bag.includes(q)) hit = { telegram: state.telegram, roblox: state.roblox, roles: state.roles, licenses: state.licenses, self: true };
  }
  adminFocusUser = hit;
  const box = $("#adm-user");
  if (!hit) {
    box.innerHTML = `<p class="sub">${t("notFound")}</p>`;
    return;
  }
  box.innerHTML = `<div class="item"><div class="kv">
    <span>${t("rbUser")}</span><b>${escapeHtml((hit.roblox && hit.roblox.username) || "—")}</b>
    <span>${t("tgUser")}</span><b>${escapeHtml((hit.telegram && hit.telegram.username) || "—")}</b>
  </div><div>${roleTags(hit.roles || [])}</div>
  <button class="btn btn-ghost mt" id="adm-full">${t("viewProfile")}</button></div>`;
  $("#adm-full").onclick = () => showFullProfile(hit);
}

function mutateRole(add) {
  if (!selectedRole) {
    toast(t("chooseRole"));
    return;
  }
  const apply = (roles) => {
    if (add && !roles.includes(selectedRole)) roles.push(selectedRole);
    if (!add) return roles.filter((r) => r !== selectedRole);
    return roles;
  };
  if (!adminFocusUser || adminFocusUser.self || (adminFocusUser.telegram && String(adminFocusUser.telegram.id) === uid())) {
    state.roles = apply(state.roles.slice());
    saveState();
    toast(t("saved"));
    renderAdmin("roles");
    return;
  }
  const id = adminFocusUser.telegram && String(adminFocusUser.telegram.id);
  if (id && store.users[id]) {
    store.users[id].roles = apply((store.users[id].roles || []).slice());
    saveStore(store);
    toast(t("saved"));
  }
}

function showFullProfile(u) {
  $("#sheet").insertAdjacentHTML(
    "beforeend",
    `<div class="item mt"><h3>${t("viewProfile")}</h3>
    <div class="kv">
      <span>${t("rbUser")}</span><b>${escapeHtml((u.roblox && u.roblox.username) || "—")}</b>
      <span>${t("rbId")}</span><b>${escapeHtml((u.roblox && u.roblox.id) || "—")}</b>
      <span>${t("tgUser")}</span><b>${escapeHtml((u.telegram && u.telegram.username) || "—")}</b>
      <span>${t("tgId")}</span><b>${escapeHtml((u.telegram && String(u.telegram.id)) || "—")}</b>
      <span>${t("status")}</span><b>${escapeHtml(u.status || "—")}</b>
    </div>
    <div class="mt">${roleTags(u.roles || [])}</div></div>`
  );
}

function openAppReview(kind, id) {
  store = loadStore();
  const list = kind === "license" ? store.licensesApps : store.applications;
  const a = list.find((x) => x.id === id);
  if (!a) return;
  const rows = Object.entries(a.data || {})
    .map(([k, v]) => `<div class="kv"><span>${escapeHtml(k)}</span><b>${escapeHtml(v)}</b></div>`)
    .join("");
  $("#modal").classList.add("open");
  $("#sheet").innerHTML = `
    <h3>${escapeHtml(a.title)}</h3>
    <p class="sub">${escapeHtml(a.ownerName)} · ${t(a.status)}</p>
    ${rows}
    <div class="btn-row mt">
      <button class="btn btn-primary" id="a-ok">${t("accept")}</button>
      <button class="btn btn-danger" id="a-no">${t("reject")}</button>
    </div>
    <button class="btn btn-ghost" id="a-back">${t("back")}</button>
  `;
  $("#a-back").onclick = () => renderAdmin(kind === "license" ? "lics" : "factions");
  $("#a-ok").onclick = () => decideApp(kind, id, "approved");
  $("#a-no").onclick = () => decideApp(kind, id, "rejected");
}

function decideApp(kind, id, status) {
  store = loadStore();
  const list = kind === "license" ? store.licensesApps : store.applications;
  const a = list.find((x) => x.id === id);
  if (!a || !canReview(a.review)) {
    toast(t("noAccess"));
    return;
  }
  a.status = status;
  if (status === "approved" && a.grant && a.owner === uid()) {
    if (!state.roles.includes(a.grant)) state.roles.push(a.grant);
  }
  if (status === "approved" && kind === "license" && a.owner === uid()) {
    state.licenses.push({ title: a.title, number: nextDocNo(), issuer: displayName() });
  }
  if (status === "approved" && a.grant && store.users[a.owner]) {
    const roles = store.users[a.owner].roles || [];
    if (!roles.includes(a.grant)) roles.push(a.grant);
    store.users[a.owner].roles = roles;
  }
  saveStore(store);
  saveState();
  toast(t("saved"));
  renderAdmin(kind === "license" ? "lics" : "factions");
}

function bindGlobal() {
  $("#privacy-check").onchange = renderPrivacy;
  $("#privacy-btn").onclick = () => {
    if (!$("#privacy-check").checked) return;
    state.privacyAccepted = true;
    state._needBind = !state.linked;
    saveState();
    haptic("ok");
    render();
  };
  $("#btn-bind-roblox").onclick = startRobloxBind;
  $("#btn-guest").onclick = guestContinue;
  $("#copy-code").onclick = async () => {
    try {
      await navigator.clipboard.writeText(CONFIG.serverCode);
    } catch {}
    toast(t("copied"));
  };
  $("#avatar-btn").onclick = () => {
    view = "profile";
    renderShell();
  };
  const secretTap = () => {
    const now = Date.now();
    logoTaps = logoTaps.filter((x) => now - x < 2500);
    logoTaps.push(now);
    if (logoTaps.length >= 3) {
      logoTaps = [];
      openAdminGate();
    }
  };
  $("#brand-tap").onclick = secretTap;
  $("#server-code-label").onclick = secretTap;
  $("#modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });
}

function boot() {
  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch {}
  }
  applyTheme();
  buildNav();
  bindGlobal();
  const params = new URLSearchParams(location.search);
  if (params.get("code")) {
    state.linked = true;
    state.privacyAccepted = true;
    state._needBind = false;
    saveState();
  }
  if (!state.privacyAccepted) {
    render();
    return;
  }
  state._needBind = false;
  showScreen("screen-splash");
  setTimeout(render, 700);
}

document.addEventListener("DOMContentLoaded", boot);

    </script>
  </body>
</html>
