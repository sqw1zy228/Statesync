    <style>
:root {
  --bg: #f4f4f2;
  --bg2: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --line: #e4e4e1;
  --accent: #111111;
  --accent-ink: #ffffff;
  --ok: #1a7f4b;
  --warn: #b45309;
  --bad: #b42318;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
  --radius: 18px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg2: #161616;
  --ink: #f5f5f5;
  --muted: #9a9a9a;
  --line: #2a2a2a;
  --accent: #f5f5f5;
  --accent-ink: #111111;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
}

#app { height: 100%; display: flex; flex-direction: column; }

.screen {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  animation: fadeUp 0.35s ease;
}
.screen.active { display: flex; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashIn {
  from { opacity: 0; letter-spacing: 0.4em; }
  to { opacity: 1; letter-spacing: 0.18em; }
}
@keyframes pulseLine {
  0%, 100% { transform: scaleX(0.4); opacity: 0.4; }
  50% { transform: scaleX(1); opacity: 1; }
}

/* SPLASH */
#screen-splash {
  background: #000;
  color: #fff;
  align-items: center;
  justify-content: center;
  text-align: center;
}
#screen-splash h1 {
  font-weight: 600;
  letter-spacing: 0.18em;
  font-size: 28px;
  animation: splashIn 0.8s ease;
}
#screen-splash p {
  margin-top: 10px;
  color: #9a9a9a;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.splash-line {
  width: 84px;
  height: 1px;
  background: #fff;
  margin: 18px auto 0;
  animation: pulseLine 1.2s ease infinite;
}

/* GATES */
.gate {
  padding: 28px 22px calc(24px + var(--safe-b));
  overflow: auto;
}
.brand-mark {
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 22px;
}
.gate h2 { font-size: 26px; font-weight: 650; margin-bottom: 14px; }
.gate p, .card p { color: var(--muted); line-height: 1.55; font-size: 14px; }

.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 18px 0;
  font-size: 14px;
}
.check input { margin-top: 3px; accent-color: var(--ink); }

.btn {
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  margin-top: 10px;
}
.btn-danger { background: var(--bad); color: #fff; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* APP SHELL */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px 8px;
  gap: 10px;
}
.code-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px 6px 12px;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.04em;
}
.code-chip button {
  border: 0;
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
}
.avatar-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  overflow: hidden;
  background: var(--bg2);
  cursor: pointer;
  padding: 0;
}
.avatar-btn img, .avatar-fallback {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.content {
  flex: 1;
  overflow: auto;
  padding: 8px 16px calc(18px + var(--nav-h) + var(--safe-b));
}

.hero {
  padding: 8px 2px 18px;
}
.hero h2 { font-size: 24px; line-height: 1.2; margin-bottom: 8px; }
.meta { font-size: 13px; color: var(--muted); margin: 10px 0; }
.meta b { color: var(--ink); }

.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
}
.item h3 { font-size: 15px; margin-bottom: 4px; }
.item small, .tag { color: var(--muted); font-size: 12px; }
.tag {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  margin: 4px 4px 0 0;
}
.tag.on { border-color: var(--ok); color: var(--ok); }

.search {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  margin-bottom: 12px;
}

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--bg2);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  z-index: 20;
}
.nav button {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
}
.nav button.active { color: var(--ink); font-weight: 700; }
.nav svg { width: 20px; height: 20px; }

.section-title { font-size: 20px; margin: 6px 0 12px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

.kv { font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
.kv span { color: var(--muted); }
.kv b { text-align: right; font-weight: 600; }

.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.switch-row:last-child { border-bottom: 0; }

.toggle {
  width: 44px;
  height: 26px;
  border-radius: 999px;
  border: 0;
  background: #cfcfcf;
  position: relative;
  cursor: pointer;
}
.toggle.on { background: var(--ink); }
.toggle i {
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.18s ease;
}
.toggle.on i { left: 21px; }

/* SIGNATURE */
.sign-box {
  border: 1px dashed var(--line);
  border-radius: 14px;
  background: var(--bg2);
  overflow: hidden;
}
#sign-canvas { width: 100%; height: 140px; display: block; touch-action: none; }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: flex-end;
  z-index: 40;
}
.modal.open { display: flex; animation: fadeUp 0.2s ease; }
.sheet {
  background: var(--bg);
  width: 100%;
  border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + var(--safe-b));
  max-height: 88%;
  overflow: auto;
}
.sheet h3 { margin-bottom: 10px; }
.field {
  width: 100%;
  margin: 8px 0;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
}
textarea.field { min-height: 88px; resize: vertical; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(80px + var(--safe-b));
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
  z-index: 50;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.status-pills { display: flex; gap: 8px; margin: 10px 0 14px; }
.status-pills button {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--ink);
  border-radius: 999px;
  padding: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}
.status-pills button.on { background: var(--ink); color: var(--bg); }

.hidden { display: none !important; }
.mt { margin-top: 10px; }
.mb { margin-bottom: 10px; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultUser();
    return Object.assign(defaultUser(), JSON.parse(raw));
  } catch {
    return defaultUser();
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const db = loadDb();
  db[uid()] = publicProfile();
  localStorage.setItem("statesync_db", JSON.stringify(db));
}
function loadDb() {
  try {
    return JSON.parse(localStorage.getItem("statesync_db") || "{}");
  } catch {
    return {};
  }
}
function uid() {

function haptic(type) {
  if (!state.settings.haptic) return;
  try {
    if (tg && tg.HapticFeedback) {
      if (type === "ok") tg.HapticFeedback.notificationOccurred("success");
      else if (type === "bad") tg.HapticFeedback.notificationOccurred("error");
      else tg.HapticFeedback.impactOccurred("light");
    }
  } catch {}
}
function beep() {
  if (!state.settings.sounds) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 660;
    g.gain.value = 0.03;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.07);
  } catch {}
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

function setupSignature() {
  const canvas = $("#sign-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = state.settings.theme === "dark" ? "#f5f5f5" : "#111";
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  if (state.signature) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = state.signature;
  }
  let draw = false;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: ((src.clientX - r.left) / r.width) * canvas.width,
      y: ((src.clientY - r.top) / r.height) * canvas.height,
    };
  };
  const start = (e) => {
    draw = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  };
  const move = (e) => {
    if (!draw) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  };
  const end = () => {
    draw = false;
  };
  canvas.onpointerdown = start;
  canvas.onpointermove = move;
  canvas.onpointerup = end;
  canvas.onpointerleave = end;
  $("#sign-clear").onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.signature = "";
    saveState();
  };
  $("#sign-save").onclick = () => {
    state.signature = canvas.toDataURL("image/png");
    saveState();
    haptic("ok");
    beep();
    toast(t("saved"));
  };
}

function startRobloxBind() {
  haptic();
  if (CONFIG.robloxClientId && CONFIG.robloxRedirectUri) {
    const url =
      "https://apis.roblox.com/oauth/v1/authorize" +
      `?client_id=${encodeURIComponent(CONFIG.robloxClientId)}` +
      `&redirect_uri=${encodeURIComponent(CONFIG.robloxRedirectUri)}` +
      `&scope=${encodeURIComponent(CONFIG.robloxScopes)}` +
      `&response_type=code&prompt=login`;
    openUrl(url);
    return;
  }
  $("#modal").classList.add("open");
  $("#sheet").innerHTML = `
    <h3>${t("demoBindTitle")}</h3>
    <p class="sub">${t("demoBindText")}</p>
    <input class="field" id="rb-user" placeholder="${t("robloxUsername")}">
    <button class="btn btn-primary" id="rb-go">${t("continue")}</button>
    <button class="btn btn-ghost" id="rb-cancel">${t("cancel")}</button>
  `;
  $("#rb-cancel").onclick = closeModal;
  $("#rb-go").onclick = () => {
    const username = ($("#rb-user").value || "").trim().replace(/^@/, "");
    if (!username) return;
    state.linked = true;
    state.roblox = {
      username,
      nickname: username,
      id: String(Math.floor(100000000 + Math.random() * 900000000)),
      avatar: "",
    };
    state._needBind = false;
    saveState();
    closeModal();
    haptic("ok");
    toast(t("saved"));
    render();
  };
}

    $("#sheet").innerHTML = `
      <h3>${t("adminTitle")}</h3>
      <input class="field" id="adm-pass" type="password" placeholder="${t("adminPass")}">
      <button class="btn btn-primary" id="adm-enter">${t("enter")}</button>
      <button class="btn btn-ghost" id="adm-close">${t("close")}</button>
    `;
    $("#adm-close").onclick = closeModal;
    $("#adm-enter").onclick = () => {
      if ($("#adm-pass").value === CONFIG.adminPassword) {
        adminAuthed = true;
        renderAdmin();
      } else toast(t("notFound"));
    };
    return;
  }
  renderAdmin();
}

function renderAdmin(found) {
  const p = found;
  $("#sheet").innerHTML = `
    <h3>${t("adminTitle")}</h3>
    <input class="field" id="adm-q" placeholder="${t("searchPh")}">
    <button class="btn btn-primary" id="adm-find">${t("find")}</button>
    <div id="adm-result" class="mt"></div>
    <button class="btn btn-ghost mt" id="adm-close">${t("close")}</button>
  `;
  $("#adm-close").onclick = closeModal;
  $("#adm-find").onclick = () => {
    const q = ($("#adm-q").value || "").trim().replace(/^@/, "").toLowerCase();
    const db = loadDb();
    let hit = null;
    Object.values(db).forEach((u) => {
      const bag = [
        u.telegram && u.telegram.username,
        u.telegram && String(u.telegram.id),
        u.roblox && u.roblox.username,
        u.roblox && u.roblox.id,
      ]
        .filter(Boolean)
        .map((x) => String(x).toLowerCase());
      if (bag.includes(q)) hit = u;
    });
    if (!hit && matchesSelf(q)) hit = publicProfile();
    adminTarget = hit;
    drawAdminResult(hit);
  };
  if (p) drawAdminResult(p);
}

function matchesSelf(q) {
  const bag = [
    state.telegram.username,
    String(state.telegram.id),
    state.roblox.username,
    state.roblox.id,
  ]
    .filter(Boolean)
    .map((x) => String(x).toLowerCase());
  return bag.includes(q);
}

function drawAdminResult(u) {
  const box = $("#adm-result");
  if (!u) {
    box.innerHTML = `<p class="sub">${t("notFound")}</p>`;
    return;
  }
  box.innerHTML = `
    <div class="item">
      <div class="kv">
        <span>${t("rbUser")}</span><b>${escapeHtml((u.roblox && u.roblox.username) || "—")}</b>
        <span>${t("tgUser")}</span><b>${escapeHtml((u.telegram && u.telegram.username) || "—")}</b>
        <span>${t("roles")}</span><b>${escapeHtml((u.roles || []).join(", ") || "—")}</b>
      </div>
      <input class="field" id="adm-role" placeholder="НПУ / КОРД / Суддя / Прокурор">
      <div class="btn-row">
        <button class="btn btn-primary" id="adm-grant">${t("grantRole")}</button>
        <button class="btn btn-ghost" id="adm-revoke">${t("revokeRole")}</button>
      </div>
      <input class="field" id="adm-lic" placeholder="${t("grantLic")}">
      <button class="btn btn-ghost" id="adm-lic-btn">${t("grantLic")}</button>
      <input class="field" id="adm-fine" placeholder="${t("reason")}">
      <button class="btn btn-ghost" id="adm-fine-btn">${t("addFine")}</button>
      <input class="field" id="adm-doc" placeholder="${t("addDoc")}">
      <button class="btn btn-ghost" id="adm-doc-btn">${t("addDoc")}</button>
    </div>
  `;
  const applyToStateIfSelf = (mut) => {
    const self =
      (u.telegram && String(u.telegram.id) === String(state.telegram.id)) ||
      (u.roblox && state.roblox.username && u.roblox.username === state.roblox.username);
    if (self) {
      mut(state);
      saveState();
    }
  };
  $("#adm-grant").onclick = () => {
    const role = $("#adm-role").value.trim();
    if (!role) return;
    applyToStateIfSelf((s) => {
      if (!s.roles.includes(role)) s.roles.push(role);
    });
    toast(t("saved"));
  };
  $("#adm-revoke").onclick = () => {
    const role = $("#adm-role").value.trim();
    applyToStateIfSelf((s) => {
      s.roles = s.roles.filter((r) => r !== role);
    });
    toast(t("saved"));
  };
  $("#adm-lic-btn").onclick = () => {
    const title = $("#adm-lic").value.trim();
    if (!title) return;
    applyToStateIfSelf((s) => {
      s.licenses.push({ title, number: String(2000 + s.licenses.length), issuer: "Admin" });
    });
    toast(t("saved"));
  };
  $("#adm-fine-btn").onclick = () => {
    const reason = $("#adm-fine").value.trim();
    if (!reason) return;
    applyToStateIfSelf((s) => {
      s.fines.push({ reason, issuer: "НПУ", amount: "—" });
    });
    toast(t("saved"));
  };
  $("#adm-doc-btn").onclick = () => {
    const title = $("#adm-doc").value.trim();
    if (!title) return;
    applyToStateIfSelf((s) => {
      s.documents.push({ title, number: String(3000 + s.documents.length), issuer: "Admin", active: true });
    });
    toast(t("saved"));
  };
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function bindGlobal() {
  $("#privacy-check").onchange = renderPrivacy;
  $("#privacy-btn").onclick = () => {
    if (!$("#privacy-check").checked) return;
    state.privacyAccepted = true;
    state._needBind = true;
    saveState();
    haptic("ok");
    render();
  };
  $("#btn-bind-roblox").onclick = startRobloxBind;
  $("#btn-guest").onclick = guestContinue;
  $("#copy-code").onclick = async () => {
    try {
      await navigator.clipboard.writeText(CONFIG.serverCode);
    } catch {}
    haptic("ok");
    beep();
    toast(t("copied"));
  };
  $("#avatar-btn").onclick = () => {
    view = "profile";
    haptic();
    renderShell();
  };
  $("#brand-tap").onclick = () => {
    const now = Date.now();
    logoTaps = logoTaps.filter((x) => now - x < 2500);
    logoTaps.push(now);
    if (logoTaps.length >= 7) {
      logoTaps = [];
      openAdminGate();
    }
  };
  $("#modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });
}

function boot() {
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    } catch {}
  }
  applyTheme();
  buildNav();
  bindGlobal();
  const params = new URLSearchParams(location.search);
  if (params.get("code") && CONFIG.robloxClientId) {
    /* Backend must exchange this code. Demo stores a flag only. */
    state.linked = true;
    state.roblox.username = state.roblox.username || "oauth_user";
    state.privacyAccepted = true;
    state._needBind = false;
    saveState();
  }
  if (!state.privacyAccepted) {
    render();
    return;
  }
  showScreen("screen-splash");
  setTimeout(render, 900);
}

document.addEventListener("DOMContentLoaded", boot);

    </script>
  </body>
</html>
